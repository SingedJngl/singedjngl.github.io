<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — {{ site.role[page.lang] }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt_text %}{{ page.excerpt_text }}{% else %}{{ site.intro[page.lang] }}{% endif %}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% if page.alt_lang_url %}<link rel="alternate" hreflang="{{ page.alt_lang }}" href="{{ page.alt_lang_url | absolute_url }}">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
