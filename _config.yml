# ---- Site ----
title: "Tom Carpanete"
url: "https://singed.github.io"
baseurl: ""
email: "tom.carpanete@edu.ece.fr"
github_user: "singed"

# Lignes d'accroche affichees sur la page d'accueil (une par langue)
intro:
  fr: "Etudiant ingenieur en systemes embarques a l'ECE Paris. Je documente ici mes projets d'electronique et de firmware : ce que je construis, les choix techniques, et ce qui casse en cours de route."
  en: "Embedded systems engineering student at ECE Paris. I document my electronics and firmware projects here: what I build, the design decisions, and what breaks along the way."

role:
  fr: "Systemes embarques & electronique"
  en: "Embedded systems & electronics"

# ---- Build ----
markdown: kramdown
kramdown:
  input: GFM
permalink: /:year/:title/
timezone: Europe/Paris

defaults:
  - scope: { path: "_posts/fr", type: "posts" }
    values: { layout: "post", lang: "fr" }
  - scope: { path: "_posts/en", type: "posts" }
    values: { layout: "post", lang: "en" }

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
